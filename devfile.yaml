schemaVersion: 2.2.0
metadata:
  name: devspace-camel-quickstart
components:
  - name: tools
    container:    
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      env:
        - name: JAVA_HOME_TEST
          value: /home/tooling/.sdkman/candidates/java/17.0.3-tem
        # - name: JDK_JAVA_OPTIONS
        #   value: "-Duser.home=/home/user"
      endpoints:
        - exposure: none
          name: debug
          protocol: tcp
          targetPort: 5005
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      # command: ['JAVA_HOME=$JAVA_HOME_17 && /entrypoint.sh']
      # args: ['JAVA_HOME=/home/tooling/.sdkman/candidates/java/17.0.3-tem']
      # args: ['JAVA_HOME','=','/home/tooling/.sdkman/candidates/java/17.0.3-tem']


  - name: m2
    volume:
      size: 1G


events:
  postStart:
    - set-camel-cli

