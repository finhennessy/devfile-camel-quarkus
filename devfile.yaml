schemaVersion: 2.2.0
metadata:
  name: devspace-camel-quickstart
projects:
  # - name: devfile-camel-quarkus
  #   git:
  #     remotes: 
  #       origin: https://github.com/finhennessy/devfile-camel-quarkus.git
  #     checkoutFrom:
  #       revision: main
  - name: camel-examples
    git:
      remotes: 
        origin: https://github.com/apache/camel-examples.git
      checkoutFrom:
        revision: main
  - name: camel-quarkus-examples
    git:
      remotes:
        origin: https://github.com/apache/camel-quarkus-examples.git
      checkoutFrom:
        revision: main
components:
  - name: tools
    container:    
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 3Gi
      mountSources: true
      env:
        - name: JAVA_HOME_TEST
          value: /home/tooling/.sdkman/candidates/java/17.0.3-tem
      endpoints:
        - exposure: none
          name: debug
          protocol: tcp
          targetPort: 5005
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080
      volumeMounts:
        - name: m2
          path: /home/user/.m2

  - name: m2
    volume:
      size: 1G

events:
  postStart:
    - set-camel-cli

commands:

  - id: set-camel-cli
    exec:
      component: tools
      commandLine: |
        source ~/.bashrc
        echo "Attempting Camel CLI installation..."

        jbang trust add https://github.com/redhat-camel
        jbang app install camel@redhat-camel/jbang-catalog/4.18.x

        # Exit 0 to ensure DevSpaces provisioning completes
        exit 0
        